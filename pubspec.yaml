name: mobile_order_flutter
description: App de toma de pedidos para vendedores - offline-first con SQLite y FTP.
publish_to: 'none'
version: 1.3.12+26

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.3.3
  path_provider: ^2.1.3
  path: ^1.9.0
  provider: ^6.1.2
  mobile_scanner: ^5.2.3
  signature: ^5.4.0
  pdf: ^3.10.8
  printing: ^5.13.1
  network_info_plus: ^6.0.1
  permission_handler: ^11.3.1
  intl: ^0.19.0
  shared_preferences: ^2.2.3
  share_plus: ^10.0.0
  package_info_plus: ^8.0.0
  http: ^1.2.0
  open_file: ^3.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "assets/icon/icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/db/moviles.db
