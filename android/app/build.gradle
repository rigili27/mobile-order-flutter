plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

// Clave de release: en local sale de android/key.properties (fuera de git,
// apunta al .jks en ~/claves-apps); en CI, de las variables de entorno que
// arma el workflow de release a partir de los secrets del repo. Nunca se
// firma un release con la clave debug: Android no dejaría actualizar encima.
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withReader('UTF-8') { reader -> keystoreProperties.load(reader) }
}

def signingValue = { String property, String env ->
    keystoreProperties.getProperty(property) ?: System.getenv(env)
}

def releaseStoreFile = signingValue('storeFile', 'ANDROID_KEYSTORE_PATH')

android {
    namespace "com.gestionerp.movil"
    compileSdk flutter.compileSdkVersion
    ndkVersion flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    defaultConfig {
        applicationId "com.gestionerp.movil"
        minSdkVersion flutter.minSdkVersion
        targetSdk flutter.targetSdkVersion
        versionCode flutter.versionCode
        versionName flutter.versionName
        multiDexEnabled true
    }

    signingConfigs {
        release {
            if (releaseStoreFile != null) {
                storeFile file(releaseStoreFile)
                storePassword signingValue('storePassword', 'ANDROID_KEYSTORE_PASSWORD')
                keyAlias signingValue('keyAlias', 'ANDROID_KEY_ALIAS')
                keyPassword signingValue('keyPassword', 'ANDROID_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            shrinkResources false
        }
    }
}

gradle.taskGraph.whenReady { graph ->
    def buildsRelease = graph.allTasks.any { it.project == project && it.name.contains('Release') }
    if (buildsRelease && releaseStoreFile == null) {
        throw new GradleException(
            'Falta la clave de release: creá android/key.properties (ver CLAUDE.md) ' +
            'o definí ANDROID_KEYSTORE_PATH y las demás ANDROID_* (CI).'
        )
    }
}

flutter {
    source '../..'
}
